[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "realtime-voice-agent"
version = "1.0.0"
description = "Real-time voice agent with WebRTC/LiveKit, Silero VAD, and Gemini AI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "lord-dubious" }
]
keywords = [
    "ai",
    "voice-agent",
    "livekit",
    "webrtc",
    "gemini",
    "vad",
    "real-time"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "livekit>=0.17.0",
    "livekit-agents>=0.11.0",
    "google-generativeai>=0.8.0",
    "silero-vad>=5.1",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "numpy>=1.24.0",
    "sounddevice>=0.5.0",
    "edge-tts>=6.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
]

[project.scripts]
voice-agent = "voice_agent.cli:app"

[project.urls]
Homepage = "https://github.com/lord-dubious/realtime-voice-agent"
Repository = "https://github.com/lord-dubious/realtime-voice-agent"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_agent"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
